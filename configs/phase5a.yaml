experiment_name: "phase5a_loss_rebalancing_faithful_restoration"
phase: "5A"
description: "Phase 5A Loss Rebalancing for Faithful Image Restoration"

dataset:
  dataset_root: "D:/kla"
  train_csv: "outputs/baseline/train_split.csv"
  val_csv: "outputs/baseline/val_split.csv"
  in_channels: 1
  out_channels: 1
  img_size: 256

model:
  phase4_checkpoint: "outputs/echo_phase4/checkpoints/echo_best.pth"
  spatial_channels: 32
  freq_channels: 32
  fusion_channels: 64
  cutoff_low: 0.15
  cutoff_high: 0.40

training:
  seed: 42
  batch_size: 8
  epochs: 5
  lr: 0.0003
  weight_decay: 1.0e-4
  scheduler_gamma: 0.8
  overfit_iters: 50

loss_weights:
  pixel_l1: 2.0
  ssim: 0.3
  hf_direct: 0.15
  sobel_edge: 0.15
  hf_component: 0.05
  freq_fft: 0.05
  lpips: 0.005
  p4_anchor: 0.02

output_dir: "outputs/phase5a"
checkpoints_dir: "outputs/phase5a/checkpoints"
results_dir: "outputs/phase5a/results"
evaluation_dir: "outputs/phase5a/evaluation"
configs_dir: "outputs/phase5a/configs"
